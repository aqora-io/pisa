[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pisa-client = { path = "crates/pisa-client" }
pisa-protocol = { path = "crates/pisa-protocol" }
pisa-repl = { path = "crates/pisa-repl" }
pisa-worker = { path = "crates/pisa-worker" }
pisa-router = { path = "crates/pisa-router" }

anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
futures = "0.3"
hex = "0.4"
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
object_store = { version = "0.14", features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tikv-client = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"
