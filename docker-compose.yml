# Local development stack, shaped like production: Traefik on port 8000
# (PISA_PORT to change it) in front of two servers, two workers, Garage (S3)
# for pickled proof states and snapshot modules, and PostgreSQL for the job
# queue between the servers and the workers and the session, state and
# snapshot records.
#   docker compose up --build
#   curl -s localhost:8000/check -H 'content-type: application/json' \
#     -d '{"code":"import Mathlib\ntheorem t : 2 + 2 = 4 := by norm_num"}'
# PROJECT=lean-core builds workers without Mathlib/Physlib, for quick tests.
# --scale server=N or --scale worker=N runs more of either.
#
# The servers also search declarations when PISA_SEARCH_QDRANT is set, with
# Qdrant from the search profile. Load a bundle built with `pisa-search build`
# (see the README) into Qdrant once, then serve it; queries are embedded with
# Qwen3-Embedding-8B on Scaleway:
#   docker compose --profile search-load run --rm search-load
#   PISA_SEARCH_QDRANT=http://qdrant:6333 SCW_SECRET_KEY=... \
#     docker compose --profile search up --build

x-database-url: &database-url postgres://pisa:pisa@postgres:5432/pisa
x-garage-key: &garage-key GK000000000000000000000001
x-garage-secret: &garage-secret 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0

services:
  # The ingress: it spreads requests over the servers, which it finds through
  # Docker (those of this project only), and stops sending them to one that
  # fails its health check or stops.
  traefik:
    image: traefik:v3.7.12
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)
      - --entrypoints.web.address=:8000
    ports: ["${PISA_PORT:-8000}:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  garage:
    image: dxflrs/garage:v2.4.1
    # --default-bucket creates the bucket and key below on first start.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: *garage-key
      GARAGE_DEFAULT_SECRET_KEY: *garage-secret
      GARAGE_DEFAULT_BUCKET: pisa
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro

  # Its data is in an anonymous volume, which `docker compose down -v` deletes.
  # The servers and workers create the tables.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pisa
      POSTGRES_PASSWORD: pisa
    # Over TCP, which only the server started after initialisation listens on.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pisa"]
      interval: 2s
      retries: 30

  # Workers take their jobs from the database, so any server serves any
  # request. The one holding a lease in the database indexes snapshots.
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    image: pisa-server
    deploy:
      replicas: 2
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure
    labels:
      traefik.enable: "true"
      traefik.http.routers.pisa.entrypoints: web
      traefik.http.routers.pisa.rule: PathPrefix(`/`)
      traefik.http.services.pisa.loadbalancer.server.port: "8000"
      traefik.http.services.pisa.loadbalancer.healthcheck.path: /health
      traefik.http.services.pisa.loadbalancer.healthcheck.interval: 2s
    # Search's queries are embedded by the model that embedded the bundle: by
    # default Qwen3-Embedding-8B on Scaleway (export SCW_SECRET_KEY). For a
    # bundle embedded with the local 0.6B model, set
    # PISA_SEARCH_EMBEDDER=http://tei:80 and add --profile search-local.
    environment:
      PISA_DATABASE_URL: *database-url
      PISA_MAX_WAIT_SECS: 120
      # Origins whose pages may call the API from a browser, e.g. a
      # playground served elsewhere; none by default.
      PISA_CORS_ORIGINS: ${PISA_CORS_ORIGINS:-}
      PISA_SEARCH_QDRANT: ${PISA_SEARCH_QDRANT:-}
      # The env_id of the loaded bundle: that of docker/lean-project.
      PISA_SEARCH_ENV_ID: ${PISA_SEARCH_ENV_ID:-v4.36.0-rc2-1e541805}
      PISA_SEARCH_TEI: ${PISA_SEARCH_EMBEDDER:-openai+https://api.scaleway.ai/v1?model=qwen3-embedding-8b&key_env=SCW_SECRET_KEY}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      # Set a describe model (e.g. claude-haiku-5-5, with ANTHROPIC_API_KEY)
      # to describe every snapshot declaration with it; without one they are
      # searched by name, signature and docstring.
      PISA_SEARCH_DESCRIBE_MODEL: ${PISA_SEARCH_DESCRIBE_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUST_LOG: info

  # Each names itself after its container and a random suffix.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args:
        PROJECT: ${PROJECT:-lean-project}
    image: pisa-worker:${PROJECT:-lean-project}
    deploy:
      replicas: 2
    depends_on:
      garage: { condition: service_started }
      postgres: { condition: service_healthy }
    # A worker exits if it can't connect to the database.
    restart: on-failure
    # bubblewrap needs to create namespaces and the worker writes to its own
    # cgroup subtree, so dev workers run privileged in a private cgroup
    # namespace. Production would grant only what these need (see the design
    # doc).
    privileged: true
    cgroup: private
    environment:
      PISA_SLOTS: ${PISA_SLOTS:-2}
      PISA_SANDBOX: bwrap
      PISA_CGROUP_ROOT: /sys/fs/cgroup
      PISA_MEMORY_MAX_MB: ${PISA_MEMORY_MAX_MB:-16000}
      PISA_MAX_RSS_MB: ${PISA_MAX_RSS_MB:-12000}
      PISA_PREWARM: ${PISA_PREWARM:-}
      # Lean Beam processes for /documents, beside the slots (0 serves none).
      PISA_BEAM_SLOTS: ${PISA_BEAM_SLOTS:-0}
      PISA_BEAM_DOCUMENTS: ${PISA_BEAM_DOCUMENTS:-4}
      PISA_BEAM_MEMORY_MAX_MB: ${PISA_BEAM_MEMORY_MAX_MB:-8000}
      PISA_STORE: s3
      PISA_DATABASE_URL: *database-url
      PISA_STATE_TTL_SECS: 86400
      AWS_ENDPOINT: http://garage:3900
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: garage
      AWS_BUCKET: pisa
      AWS_ACCESS_KEY_ID: *garage-key
      AWS_SECRET_ACCESS_KEY: *garage-secret
      RUST_LOG: info

  # Holds the search index: the bundle's declarations and the snapshots'.
  qdrant:
    profiles: [search, search-load]
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - qdrant-data:/qdrant/storage

  # Loads the bundle in PISA_SEARCH_BUNDLE (default search/bundle) into Qdrant.
  search-load:
    profiles: [search-load]
    image: pisa-server
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    entrypoint: ["pisa-search"]
    depends_on: [qdrant]
    volumes:
      - ${PISA_SEARCH_BUNDLE:-./search/bundle}:/bundle:ro
    command: ["load", "--bundle", "/bundle", "--qdrant", "http://qdrant:6333"]
    environment:
      RUST_LOG: info

  # Qwen3-Embedding-0.6B on the CPU, for bundles embedded with it.
  tei:
    profiles: [search-local]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--max-client-batch-size", "64"]
    ports: ["127.0.0.1:8090:80"]
    volumes:
      - tei-models:/data

volumes:
  qdrant-data:
  tei-models:
