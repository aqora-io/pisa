# Local development stack: one router, two workers, Garage (S3) for pickled
# proof states and snapshot modules, and a single-node TiKV for the session,
# state and snapshot records.
#   docker compose up --build
#   curl -s localhost:8000/check -H 'content-type: application/json' \
#     -d '{"code":"import Mathlib\ntheorem t : 2 + 2 = 4 := by norm_num"}'
# PROJECT=lean-core builds workers without Mathlib/Physlib, for quick tests.
#
# Declaration search is an optional profile; it serves a bundle built with
# `pisa-search build` (see the README) and embeds queries with Qwen3-Embedding-8B
# on Scaleway:
#   SCW_SECRET_KEY=... docker compose --profile search up --build

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: worker
    args:
      PROJECT: ${PROJECT:-lean-project}
  image: pisa-worker:${PROJECT:-lean-project}
  depends_on: [router, garage, tikv]
  # PD takes a few seconds to start serving, and a worker exits if it can't
  # connect to it.
  restart: on-failure
  # bubblewrap needs to create namespaces and the worker writes to its own
  # cgroup subtree, so dev workers run privileged in a private cgroup namespace.
  # Production would grant only what these need (see the design doc).
  privileged: true
  cgroup: private
  environment: &worker-env
    PISA_ROUTER: router:7070
    PISA_SLOTS: ${PISA_SLOTS:-2}
    PISA_SANDBOX: bwrap
    PISA_CGROUP_ROOT: /sys/fs/cgroup
    PISA_MEMORY_MAX_MB: ${PISA_MEMORY_MAX_MB:-16000}
    PISA_MAX_RSS_MB: ${PISA_MAX_RSS_MB:-12000}
    PISA_PREWARM: ${PISA_PREWARM:-}
    PISA_STORE: s3
    PISA_METADATA: tikv
    PISA_TIKV_PD: pd:2379
    PISA_STATE_TTL_SECS: 86400
    AWS_ENDPOINT: http://garage:3900
    AWS_ALLOW_HTTP: "true"
    AWS_REGION: garage
    AWS_BUCKET: pisa
    AWS_ACCESS_KEY_ID: &garage-key GK000000000000000000000001
    AWS_SECRET_ACCESS_KEY: &garage-secret 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
    RUST_LOG: info

services:
  garage:
    image: dxflrs/garage:v2.4.1
    # --default-bucket creates the bucket and key below on first start.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: *garage-key
      GARAGE_DEFAULT_SECRET_KEY: *garage-secret
      GARAGE_DEFAULT_BUCKET: pisa
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro

  # A single PD and a single TiKV. Not durable: the data lives in the containers.
  pd:
    image: pingcap/pd:v8.5.1
    command:
      - --name=pd
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380

  tikv:
    image: pingcap/tikv:v8.5.1
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      - --data-dir=/data
      - --pd=pd:2379
    ulimits: { nofile: 1048576 }
    depends_on: [pd]

  router:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: router
    image: pisa-router
    ports: ["8000:8000"]
    environment:
      PISA_MAX_WAIT_SECS: 120
      RUST_LOG: info

  worker-1:
    <<: *worker
    environment:
      <<: *worker-env
      PISA_WORKER_ID: worker-1

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      PISA_WORKER_ID: worker-2

  search:
    profiles: [search]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: search
    image: pisa-search
    ports: ["8100:8100"]
    # It reads the workers' snapshot catalog, and exits if PD isn't serving yet.
    depends_on: [tikv]
    restart: on-failure
    # Writable: tantivy takes a lock file when it opens the index.
    volumes:
      - ${PISA_SEARCH_BUNDLE:-./search/bundle}:/bundle
    # Queries are embedded by the model that embedded the bundle: by default
    # Qwen3-Embedding-8B on Scaleway (export SCW_SECRET_KEY). For a bundle
    # embedded with the local 0.6B model, set PISA_SEARCH_EMBEDDER=http://tei:80
    # and add --profile search-local.
    environment:
      PISA_SEARCH_BUNDLE: /bundle
      PISA_SEARCH_TEI: ${PISA_SEARCH_EMBEDDER:-openai+https://api.scaleway.ai/v1?model=qwen3-embedding-8b&key_env=SCW_SECRET_KEY}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      # Snapshot search. Set a describe model (e.g. claude-haiku-5-5, with
      # ANTHROPIC_API_KEY) to describe every snapshot declaration with it;
      # without one they are searched by name, signature and docstring.
      PISA_TIKV_PD: pd:2379
      PISA_SEARCH_DESCRIBE_MODEL: ${PISA_SEARCH_DESCRIBE_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUST_LOG: info

  # Qwen3-Embedding-0.6B on the CPU, for bundles embedded with it.
  tei:
    profiles: [search-local]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--max-client-batch-size", "64"]
    ports: ["127.0.0.1:8090:80"]
    volumes:
      - tei-models:/data

volumes:
  tei-models:
