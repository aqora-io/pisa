[package]
name = "pisa-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Python bindings for pisa-client (built with maturin)"

[lib]
name = "pisa_client_native"
crate-type = ["cdylib"]
# Linking a test harness needs libpython; test from Python instead.
test = false
doctest = false

[dependencies]
pisa-client.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
