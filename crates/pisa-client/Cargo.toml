[package]
name = "pisa-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async client for pisa, a server that checks Lean 4 code"
readme = "README.md"
keywords = ["lean", "lean4", "theorem-prover", "pisa"]
categories = ["api-bindings", "mathematics"]

[features]
default = ["rustls"]
# HTTPS support; plain-HTTP deployments can disable it.
rustls = ["reqwest/rustls"]

[dependencies]
bytes.workspace = true
pisa-protocol.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
