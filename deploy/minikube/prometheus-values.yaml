# A small prometheus-community/prometheus for minikube: just the server, which
# scrapes services annotated prometheus.io/scrape (the pisa router), every 5s
# so KEDA reacts quickly.
server:
  global:
    scrape_interval: 5s
    # Must not exceed the interval; the chart defaults to 10s.
    scrape_timeout: 4s
  persistentVolume:
    enabled: false
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
