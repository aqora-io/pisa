# A single PD and a single TiKV for trying the chart on minikube, where the
# minikube values expect them as Services "pd" and "tikv". Not durable and not
# replicated: emptyDir storage.
#   kubectl apply -f deploy/minikube/tikv.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: pd }
  template:
    metadata:
      labels: { app: pd }
    spec:
      containers:
        - name: pd
          image: pingcap/pd:v8.5.1
          args:
            - --name=pd
            - --data-dir=/data
            - --client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://pd:2379
            - --peer-urls=http://0.0.0.0:2380
            - --advertise-peer-urls=http://pd:2380
          ports:
            - { name: client, containerPort: 2379 }
            - { name: peer, containerPort: 2380 }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pd
spec:
  selector: { app: pd }
  ports:
    - { name: client, port: 2379, targetPort: client }
    - { name: peer, port: 2380, targetPort: peer }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tikv
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: tikv }
  template:
    metadata:
      labels: { app: tikv }
    spec:
      containers:
        - name: tikv
          image: pingcap/tikv:v8.5.1
          args:
            - --addr=0.0.0.0:20160
            - --advertise-addr=tikv:20160
            - --status-addr=0.0.0.0:20180
            - --data-dir=/data
            - --pd=pd:2379
          ports:
            - { name: tikv, containerPort: 20160 }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tikv
spec:
  selector: { app: tikv }
  ports:
    - { name: tikv, port: 20160, targetPort: tikv }
