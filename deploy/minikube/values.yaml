# Values for trying the chart on minikube with locally built images, the
# Garage from garage.yaml for snapshot modules, and the PostgreSQL from
# postgres.yaml for the job queue and the document, session, state and
# snapshot records:
#   minikube -p pisa image load pisa-server:latest pisa-worker:lean-core
#   kubectl apply -f deploy/minikube/garage.yaml
#   kubectl apply -f deploy/minikube/postgres.yaml
server:
  image: { pullPolicy: Never }
  # Rollouts of the demo needn't wait out long requests.
  drainTimeoutSecs: 30
  resources:
    requests: { cpu: 100m, memory: 64Mi }

worker:
  # The image without Mathlib, so loading it into minikube is quick.
  image: { tag: lean-core, pullPolicy: Never }
  slots: 2
  memoryMaxMb: 1500
  maxRssMb: 1200
  beamMemoryMaxMb: 1500
  drainTimeoutSecs: 120
  # Small requests so four workers fit on one minikube node.
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { memory: 5000Mi }

store:
  s3:
    bucket: pisa
    region: garage
    endpoint: http://garage:3900
    allowHttp: true
    credentialsSecret: { name: pisa-s3 }

metadata:
  database:
    urlSecret: { name: pisa-db }

keda:
  minReplicas: 1
  maxReplicas: 4
  # Scale back down quickly so the demo doesn't wait five minutes.
  scaleDownStabilizationSecs: 30
  pollingInterval: 5
