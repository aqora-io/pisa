# Default values for pisa. Like most application charts, it expects the
# cluster's own KEDA, and doesn't bundle it.

# The HTTP API: checks, sessions and snapshots, and search when
# search.enabled. Its replicas put jobs on the database's job queue, which the
# workers take them from, so any replica serves any request.
server:
  image:
    # Built from docker/Dockerfile (target server) and published with each
    # release. An empty tag is the chart's appVersion. To build your own, pass
    # `--build-arg REVISION=<commit>`, so `/health` and the image label name
    # the commit it runs.
    repository: ghcr.io/aqora-io/pisa-server
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { memory: 1Gi }
  # On SIGTERM, how long a replica waits for its requests in flight. Keep it
  # above router.maxWaitSecs plus the longest job, or rollouts cut some off.
  drainTimeoutSecs: 360
  # Replicas kept through voluntary disruptions such as node drains.
  minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  # Origins whose pages may call the API from a browser, e.g.
  # https://app.example.com, or "*" for any. None by default.
  corsOrigins: []
  # e.g. SSL_CERT_FILE for a database with a private CA.
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Secrets for pulling the images from a private registry, e.g.
# [{ name: regcred }].
imagePullSecrets: []

# The servers' and workers' service account. Annotate it to give the pods a
# cloud identity, e.g. EKS IRSA's eks.amazonaws.com/role-arn for the store's
# bucket.
serviceAccount:
  create: true
  # Empty means the release's full name when created, and "default" when not.
  name: ""
  annotations: {}

# The job queue that the release's servers and workers share; empty means
# the release's name, so releases sharing a database keep their jobs apart.
queue: ""

# How the servers queue jobs.
router:
  # Seconds a request may wait for a free worker. Keep it above the time a new
  # worker pod takes to start, so requests queued during a scale-up don't fail.
  maxWaitSecs: 300
  maxRetries: 2
  # Version used when a request names none (by default `worker.version`),
  # and NAME=VERSION aliases.
  defaultVersion: ""
  aliases: []

# The axioms every proof may use, for the workers' verdicts and the servers'
# audits alike. Empty keeps the default: propext, Classical.choice,
# Quot.sound.
allowedAxioms: []

worker:
  # The version this pool's image serves, `<toolchain>-<hash>`, as
  # scripts/env.py prints it and GET /environments lists it. The pool scales
  # on its version's jobs and those that name none, requests that name none
  # go to it unless router.defaultVersion says otherwise, and a worker whose
  # image serves another version doesn't start. Empty, the pool scales on
  # every job; `pools` need it. The default is docker/lean-project's: Lean
  # v4.36.0 with Mathlib, Physlib and CSLib. docker/lean-core's, Lean alone,
  # is v4.36.0-ca45ccf8.
  version: v4.36.0-54500a67
  image:
    # Built from docker/Dockerfile (target worker) on an environment's
    # project, by scripts/env.py for one of your own. Each release publishes
    # docker/lean-project's and docker/lean-core's. An empty tag is
    # `<appVersion>-<version>`, as scripts/env.py tags it.
    repository: ghcr.io/aqora-io/pisa-worker
    tag: ""
    pullPolicy: IfNotPresent
  # Lean processes per pod.
  slots: 2
  # bubblewrap sandbox per Lean process ("bwrap" or "none"). bwrap and cgroup
  # limits need a privileged container in this example.
  sandbox: bwrap
  # A worker that can't set up its cgroups doesn't start; false runs Lean
  # without per-process limits.
  cgroups: true
  # memory.max per Lean process (MiB); also sizes the pod's memory limit.
  memoryMaxMb: 8000
  maxRssMb: 6000
  # Headers to import at startup, separated by ';', e.g. "import Mathlib".
  prewarm: ""
  # Lean Beam processes per pod for /documents and tactic sessions, beside
  # the slots (0 serves neither), and the documents each keeps open.
  beamSlots: 1
  beamDocuments: 4
  # memory.max per Beam process (MiB); also sizes the pod's memory limit.
  beamMemoryMaxMb: 8000
  # On scale-down a worker stops taking jobs and finishes the ones it has, for
  # at most this long. The pod's grace period is 30s longer.
  drainTimeoutSecs: 600
  # How long a worker's claim on a job lasts without a heartbeat, which comes
  # every third of it. A job whose worker died waits this long for another;
  # a shorter lease lets a worker's stall hand its job to another while it
  # still runs it.
  leaseSecs: 30
  # Extra pod resources besides the per-process memory.
  overheadMemoryMb: 512
  # Pod resources. Empty means: one CPU per slot and Beam slot requested, and
  # a memory limit of slots × memoryMaxMb + beamSlots × beamMemoryMaxMb +
  # overheadMemoryMb.
  resources: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Worker pools for other environments, beside `worker`'s: other toolchains,
# other libraries. Each is a Deployment and a ScaledObject of its own, on the
# release's servers, database and store, and scales on the jobs of its
# version alone. A pool takes `worker`'s settings, and overrides those it
# names.
pools: []
  # - # Required: the version its image serves.
  #   version: v4.35.0-1a2b3c4d
  #   # What its Deployment's name ends in. By default the version, with
  #   # dashes for dots.
  #   name: lean-4-35
  #   # Its image: `worker`'s repository, tagged `<appVersion>-<version>` as
  #   # scripts/env.py tags it, unless set.
  #   image: { tag: 1.0.0-v4.35.0-1a2b3c4d }
  #   # Its replicas, by default keda's. With 0 it runs no pod until a
  #   # request names its version, which then waits for one to start: keep
  #   # router.maxWaitSecs above that, the image's pull included.
  #   minReplicas: 0
  #   maxReplicas: 2
  #   # And any of `worker`'s keys.
  #   slots: 1

# S3-compatible storage for snapshot modules. All workers of a release share
# it.
store:
  s3:
    # Required.
    bucket: ""
    region: ""
    # For S3-compatible stores (MinIO, Garage, R2, ...); empty means AWS S3.
    endpoint: ""
    allowHttp: false
    # An existing Secret holding the credentials. Without one, workers use the
    # pod's ambient credentials (e.g. EKS IRSA or an instance role).
    credentialsSecret:
      name: ""
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  # Delete documents, sessions and their states older than this (0 keeps
  # them).
  stateTtlSecs: 86400

# PostgreSQL holds the job queue between the servers and the workers, and
# the metadata that all workers of a release share: the documents, the
# sessions and their states, and the snapshot entries and module records. It has
# the only copy of the snapshot records, which never expire, so it must be
# durable and backed up. The chart doesn't deploy PostgreSQL; run it with
# CloudNativePG (https://cloudnative-pg.io), as a managed service or by any
# other means. The servers and workers create the tables. Connect directly,
# or through PgBouncer in session mode, not transaction mode.
metadata:
  database:
    # Required: an existing Secret holding the database's URL, e.g.
    # postgres://pisa:...@db.example.com/pisa?sslmode=require. With
    # sslmode=require the server's certificate is checked against the
    # image's roots; for a private CA, mount it and set SSL_CERT_FILE through
    # server.extraEnv and worker.extraEnv. KEDA reads the queue through it too.
    urlSecret:
      name: ""
      key: url

# Workers scale on the jobs in the queue, which KEDA counts in the database.
keda:
  enabled: true
  # 0 lets the pool scale to zero; the first request then waits for a cold
  # worker, so keep router.maxWaitSecs above the worker's startup time.
  minReplicas: 1
  maxReplicas: 4
  # Seconds of low demand before workers are removed.
  scaleDownStabilizationSecs: 300
  # How often KEDA counts the jobs, which bounds how quickly workers react to
  # load; with minReplicas 0, how long the pool stays up after the last job.
  pollingInterval: 15
  cooldownPeriod: 300
  # Outstanding jobs (queued + running) per worker pod. Defaults to slots.
  jobsPerWorker: null


# Declaration search in the servers, over Qdrant, which holds the index (see
# the README's Search section). Load a bundle into Qdrant first, with
# `pisa-search load`; until then search answers 503 and the rest of the API
# works.
search:
  enabled: false
  # The version of the bundle loaded into Qdrant, its env_id. Empty means
  # worker.version's.
  version: ""
  # Embeds queries and snapshot declarations; it must serve the model that
  # embedded the bundle. See `pisa-search embed`.
  embedder: "openai+https://api.scaleway.ai/v1?model=qwen3-embedding-8b&key_env=SCW_SECRET_KEY"
  # Search the workers' snapshots. The replica holding a lease in the
  # database indexes them.
  snapshots: true
  # Claude or OpenAI model that describes every snapshot declaration, so all
  # snapshot code goes to that provider; empty for none. What is sent, and
  # to whom: README, "What snapshot search sends to a model".
  describeModel: ""
  # LLM and embedding requests in flight for snapshots.
  describeConcurrency: 8
  # An existing Secret with the API keys, under these keys; missing ones are skipped.
  secret:
    name: ""
    scwSecretKey: SCW_SECRET_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    openaiApiKey: OPENAI_API_KEY
  qdrant:
    # A Qdrant you run; empty means this release's qdrant subchart.
    url: ""
    # An existing Secret holding Qdrant's API key, if it needs one.
    apiKeySecret:
      name: ""
      key: api-key

# The official Qdrant chart (https://qdrant.github.io/qdrant-helm), used when
# search.qdrant.url is empty. Load bundles with `--replication 2`, so that
# each collection keeps a copy when a node goes.
qdrant:
  enabled: false
  replicaCount: 3
