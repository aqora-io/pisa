{{- if .Values.search.enabled }}
{{- $name := include "pisa.fullname" . }}
{{- $qdrant := .Values.search.qdrant.url }}
{{- if not $qdrant }}
{{- if not .Values.qdrant.enabled }}
{{- fail "search needs search.qdrant.url, or qdrant.enabled for the Qdrant subchart" }}
{{- end }}
{{- $qname := ternary .Release.Name (printf "%s-qdrant" .Release.Name) (contains "qdrant" .Release.Name) }}
{{- $qdrant = printf "http://%s:6333" ($qname | trunc 63 | trimSuffix "-") }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-search
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  # Replicas hold no state: Qdrant holds the index, and the one holding a
  # lease in the database indexes snapshots.
  {{- if not .Values.search.autoscaling.enabled }}
  replicas: {{ .Values.search.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pisa.selector" (dict "root" . "component" "search") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pisa.selector" (dict "root" . "component" "search") | nindent 8 }}
    spec:
      containers:
        - name: search
          image: "{{ .Values.search.image.repository }}:{{ .Values.search.image.tag }}"
          imagePullPolicy: {{ .Values.search.image.pullPolicy }}
          env:
            - { name: PISA_SEARCH_HTTP, value: "0.0.0.0:8100" }
            - { name: PISA_SEARCH_QDRANT, value: {{ $qdrant | quote }} }
            - { name: PISA_SEARCH_ENV_ID, value: {{ required "search.envId is required" .Values.search.envId | quote }} }
            {{- with .Values.search.embedder }}
            - { name: PISA_SEARCH_TEI, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.search.snapshots }}
            - name: PISA_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ required "search.snapshots needs metadata.database.urlSecret.name" .Values.metadata.database.urlSecret.name | quote }}, key: {{ .Values.metadata.database.urlSecret.key | quote }} } }
            {{- with .Values.search.describeModel }}
            - { name: PISA_SEARCH_DESCRIBE_MODEL, value: {{ . | quote }} }
            {{- end }}
            - { name: PISA_SEARCH_DESCRIBE_CONCURRENCY, value: {{ .Values.search.describeConcurrency | quote }} }
            {{- end }}
            {{- with .Values.search.secret.name }}
            {{- range $var, $key := dict "SCW_SECRET_KEY" $.Values.search.secret.scwSecretKey "ANTHROPIC_API_KEY" $.Values.search.secret.anthropicApiKey "OPENAI_API_KEY" $.Values.search.secret.openaiApiKey }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.search.secret.name | quote }}, key: {{ $key | quote }}, optional: true }
            {{- end }}
            {{- end }}
            {{- with .Values.search.qdrant.apiKeySecret.name }}
            - { name: PISA_SEARCH_QDRANT_KEY_ENV, value: QDRANT_API_KEY }
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ . | quote }}, key: {{ $.Values.search.qdrant.apiKeySecret.key | quote }} }
            {{- end }}
            - { name: RUST_LOG, value: info }
          ports:
            - { name: http, containerPort: 8100 }
          # Not ready while Qdrant doesn't answer; alive as long as it listens.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.search.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-search
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  type: {{ .Values.search.service.type }}
  selector:
    {{- include "pisa.selector" (dict "root" . "component" "search") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.search.service.port }}, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-search
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  minAvailable: {{ .Values.search.minAvailable }}
  selector:
    matchLabels:
      {{- include "pisa.selector" (dict "root" . "component" "search") | nindent 6 }}
{{- if .Values.search.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-search
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-search
  minReplicas: {{ .Values.search.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.search.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.search.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
