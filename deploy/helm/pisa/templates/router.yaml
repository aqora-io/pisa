{{- $name := include "pisa.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-router
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  # The router holds the global queue, so there is exactly one.
  replicas: 1
  selector:
    matchLabels:
      {{- include "pisa.selector" (dict "root" . "component" "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pisa.selector" (dict "root" . "component" "router") | nindent 8 }}
    spec:
      containers:
        - name: router
          image: "{{ .Values.router.image.repository }}:{{ .Values.router.image.tag }}"
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          env:
            - { name: PISA_HTTP, value: "0.0.0.0:8000" }
            - { name: PISA_WORKERS, value: "0.0.0.0:7070" }
            - { name: PISA_MAX_WAIT_SECS, value: {{ .Values.router.maxWaitSecs | quote }} }
            - { name: PISA_MAX_RETRIES, value: {{ .Values.router.maxRetries | quote }} }
            {{- with .Values.router.defaultVersion }}
            - { name: PISA_DEFAULT_VERSION, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.router.aliases }}
            - { name: PISA_ALIASES, value: {{ join "," . | quote }} }
            {{- end }}
          ports:
            - { name: http, containerPort: 8000 }
            - { name: workers, containerPort: 7070 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-router
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
  {{- if .Values.metrics.scrapeAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
  {{- end }}
spec:
  type: {{ .Values.router.service.type }}
  selector:
    {{- include "pisa.selector" (dict "root" . "component" "router") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.router.service.port }}, targetPort: http }
---
# Workers dial the router here. No auth yet: keep it inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-router-workers
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pisa.selector" (dict "root" . "component" "router") | nindent 4 }}
  ports:
    - { name: workers, port: 7070, targetPort: workers }
