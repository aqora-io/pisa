{{- $name := include "pisa.fullname" . }}
{{- range $i, $pool := include "pisa.poolList" . | fromYamlArray }}
{{- $w := include "pisa.pool" (dict "root" $ "pool" $pool) | fromYaml }}
{{- $component := printf "worker%s" $w.suffix }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "pisa.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not $.Values.keda.enabled }}
  replicas: {{ $w.minReplicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pisa.selector" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pisa.selector" (dict "root" $ "component" $component) | nindent 8 }}
    spec:
      # SIGTERM starts a drain: no new jobs, finish the running ones, exit.
      terminationGracePeriodSeconds: {{ add $w.drainTimeoutSecs 30 }}
      {{- include "pisa.podCommon" $ | nindent 6 }}
      {{- include "pisa.scheduling" $w | nindent 6 }}
      containers:
        - name: worker
          image: "{{ $w.image.repository }}:{{ $w.image.tag }}"
          imagePullPolicy: {{ $w.image.pullPolicy }}
          {{- if or (eq $w.sandbox "bwrap") $w.cgroups }}
          securityContext:
            # bubblewrap creates namespaces and the worker writes to its own
            # cgroup subtree. A production setup would grant only what these need.
            privileged: true
          {{- end }}
          env:
            - name: PISA_WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: PISA_QUEUE, value: {{ include "pisa.queue" $ | quote }} }
            {{- with $w.version }}
            # A worker whose image serves another version doesn't start.
            - { name: PISA_EXPECT_VERSION, value: {{ . | quote }} }
            {{- end }}
            - { name: PISA_SLOTS, value: {{ $w.slots | quote }} }
            - { name: PISA_SANDBOX, value: {{ $w.sandbox | quote }} }
            {{- if $w.cgroups }}
            - { name: PISA_CGROUP_ROOT, value: /sys/fs/cgroup }
            {{- end }}
            - { name: PISA_MEMORY_MAX_MB, value: {{ $w.memoryMaxMb | quote }} }
            - { name: PISA_MAX_RSS_MB, value: {{ $w.maxRssMb | quote }} }
            - { name: PISA_PREWARM, value: {{ $w.prewarm | quote }} }
            - { name: PISA_BEAM_SLOTS, value: {{ $w.beamSlots | quote }} }
            - { name: PISA_BEAM_DOCUMENTS, value: {{ $w.beamDocuments | quote }} }
            - { name: PISA_BEAM_MEMORY_MAX_MB, value: {{ $w.beamMemoryMaxMb | quote }} }
            - { name: PISA_DRAIN_TIMEOUT_SECS, value: {{ $w.drainTimeoutSecs | quote }} }
            - { name: PISA_LEASE_SECS, value: {{ $w.leaseSecs | quote }} }
            {{- with $.Values.allowedAxioms }}
            - { name: PISA_ALLOWED_AXIOMS, value: {{ join "," . | quote }} }
            {{- end }}
            - { name: PISA_STORE, value: s3 }
            - name: PISA_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ required "metadata.database.urlSecret.name is required" $.Values.metadata.database.urlSecret.name | quote }}, key: {{ $.Values.metadata.database.urlSecret.key | quote }} } }
            - { name: PISA_STATE_TTL_SECS, value: {{ $.Values.store.stateTtlSecs | quote }} }
            {{- with $.Values.store.s3 }}
            - { name: AWS_BUCKET, value: {{ required "store.s3.bucket is required" .bucket | quote }} }
            {{- with .region }}
            - { name: AWS_REGION, value: {{ . | quote }} }
            {{- end }}
            {{- with .endpoint }}
            - { name: AWS_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            - { name: AWS_ALLOW_HTTP, value: {{ .allowHttp | quote }} }
            {{- with .credentialsSecret.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ . }}, key: {{ $.Values.store.s3.credentialsSecret.accessKeyIdKey }} } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: {{ $.Values.store.s3.credentialsSecret.secretAccessKeyKey }} } }
            {{- end }}
            {{- end }}
            {{- with $w.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- if $w.resources }}
            {{- toYaml $w.resources | nindent 12 }}
            {{- else }}
            # About a core per Lean process; memory for every process at its cap.
            requests:
              cpu: {{ add $w.slots $w.beamSlots | quote }}
              memory: "{{ $w.overheadMemoryMb }}Mi"
            limits:
              memory: "{{ add (mul $w.slots $w.memoryMaxMb) (mul $w.beamSlots $w.beamMemoryMaxMb) $w.overheadMemoryMb }}Mi"
            {{- end }}
{{- end }}
