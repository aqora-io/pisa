{{- if .Values.keda.enabled }}
{{- $name := include "pisa.fullname" . }}
# Scales workers on outstanding jobs (queued + running) in the database's job
# queue, so that replicas = ceil(outstanding / jobsPerWorker).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $name }}-worker
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  {{- if eq (int .Values.keda.minReplicas) 0 }}
  # Only used when scaling to zero.
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  {{- end }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Scale down only after demand has stayed low this long. Removed
          # workers drain, so this trades idle pods against cold imports.
          stabilizationWindowSeconds: {{ .Values.keda.scaleDownStabilizationSecs }}
  triggers:
    - type: postgresql
      metadata:
        # Jobs not done yet: queued, running, or given up a moment ago.
        query: {{ printf "SELECT count(*) FROM jobs WHERE queue = '%s' AND result IS NULL" (include "pisa.queue" .) | quote }}
        targetQueryValue: {{ .Values.keda.jobsPerWorker | default .Values.worker.slots | quote }}
        activationTargetQueryValue: "0"
      authenticationRef:
        name: {{ $name }}-worker-database
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $name }}-worker-database
  labels:
    {{- include "pisa.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: connection
      name: {{ required "metadata.database.urlSecret.name is required" .Values.metadata.database.urlSecret.name | quote }}
      key: {{ .Values.metadata.database.urlSecret.key | quote }}
{{- end }}
