# The project every worker serves: Physlib, and Mathlib through it.
# Bump all revs together with lean-toolchain and REPL_REV in worker.Dockerfile.
name = "pisa_project"
defaultTargets = ["PisaProject"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.35.0"

# Importing this builds everything a request may import.
[[lean_lib]]
name = "PisaProject"
