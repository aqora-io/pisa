# The tests, on every pull request and push to main: the workspace's with
# PostgreSQL as well as SQLite, the real-Lean tests on the toolchain the image
# installs, the clients', and the end-to-end script on a lean-core stack with
# Lean Beam.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust, PostgreSQL and real Lean
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pisa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Every catalog and queue test runs on it too, not only on SQLite.
      PISA_TEST_DATABASE_URL: postgres://postgres:pisa@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Pisa library
        working-directory: docker/pisa-lean
        run: lake build
      - name: Real-Lean tests
        run: cargo test -p pisa-worker --test real_lean -- --ignored
      # Lean Beam is beta: this catches a toolchain whose Beam tools changed.
      - name: Real-Beam tests
        run: cargo test -p pisa-beam --test real_beam -- --ignored

  clients:
    name: Web and Python clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server, the worker and the fake Lean
        run: cargo build -p pisa-server -p pisa-worker -p pisa-tests -p pisa-search
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web client
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm test:integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python client
        working-directory: crates/pisa-python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop
          pytest tests

  e2e:
    name: End to end on lean-core
    runs-on: ubuntu-latest
    env:
      PROJECT: lean-core
      COMPOSE_PROJECT_NAME: pisa
      PISA_PORT: "8000"
      PISA_BEAM_SLOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the server
        run: |
          for _ in $(seq 1 150); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1
      - name: End-to-end script
        run: python3 scripts/e2e.py --beam
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop the stack
        if: always()
        run: docker compose down -v
