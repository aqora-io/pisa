# Publishes a release when its tag, v<version>, is pushed:
# - the server's image, and docker/lean-core's worker image, to ghcr.io;
# - the chart to ghcr.io, as an OCI artifact;
# - the Python client to PyPI, the TypeScript clients to npm, and the
#   protocol and client crates to crates.io;
# - a GitHub release with the changelog's section.
# docker/lean-project's worker image, with Mathlib, is too large to build
# here, and is pushed by hand: CONTRIBUTING.md, "Releasing".
# Actions outside actions/* are pinned to a commit, as this workflow holds the
# registries' credentials; Dependabot keeps the pins current.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: The tag names the workspace's version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, but the workspace's version is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: Images
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lean-core's environment
        id: core
        run: echo "version=$(python3 scripts/env.py label docker/lean-core)" >> "$GITHUB_OUTPUT"
      - name: Server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: docker/Dockerfile
          target: server
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.REGISTRY }}/pisa-server:${{ env.VERSION }}
          push: true
      - name: lean-core's worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          file: docker/Dockerfile
          target: worker
          build-args: |
            PROJECT=lean-core
            REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.REGISTRY }}/pisa-worker:${{ env.VERSION }}-${{ steps.core.outputs.version }}
          push: true

  chart:
    name: Chart
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm dependency build deploy/helm/pisa
      - run: helm package deploy/helm/pisa
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: helm push "pisa-${{ needs.version.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  wheels:
    name: Wheel for ${{ matrix.os }} ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/pisa-python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.target }}
          path: crates/pisa-python/dist

  sdist:
    name: Python source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/pisa-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: crates/pisa-python/dist

  pypi:
    name: PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # PyPI trusts this workflow and environment as the project's publisher.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: npm
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # For the packages' provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build and publish
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "./packages/*" build
          pnpm --filter "./packages/*" publish --access public --no-git-checks

  crates:
    name: crates.io
    needs: version
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo publish -p pisa-protocol -p pisa-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub release
    needs: [version, images, chart, pypi, npm, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release with the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## / { if (on) exit; on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --title "pisa $VERSION" --notes-file notes.md
