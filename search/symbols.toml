# Notation and LaTeX tokens → the Mathlib and Physlib constants they usually
# mean. Soft hints for the structural lane, never filters. Tokens are as
# `pisa_search::text::tokens` produces them (lowercase words, Unicode symbols;
# LaTeX is converted first, so `\otimes` arrives as `⊗`). `context` words give
# an entry full weight; without them it counts half. A token of several words,
# as "partial trace", matches only when the query has all of them.
#
# Seed list: review and extend. Unknown constants are dropped at load.

# Linear algebra and operators
[[symbol]]
tokens = ["tr", "trace"]
constants = ["Matrix.trace", "LinearMap.trace"]
context = ["matrix", "operator", "density", "state", "ρ"]

[[symbol]]
tokens = ["†", "ᴴ", "dagger", "adjoint", "conjugate"]
constants = ["Matrix.conjTranspose", "Star.star", "ContinuousLinearMap.adjoint", "LinearMap.adjoint"]

[[symbol]]
tokens = ["⊗", "tensor", "kronecker"]
constants = ["TensorProduct", "Matrix.kroneckerMap", "TensorProduct.tmul"]

[[symbol]]
tokens = ["det", "determinant"]
constants = ["Matrix.det", "LinearMap.det"]

[[symbol]]
tokens = ["hermitian", "self", "selfadjoint"]
constants = ["Matrix.IsHermitian", "IsSelfAdjoint", "HermitianMat"]

[[symbol]]
tokens = ["unitary"]
constants = ["Matrix.unitaryGroup", "unitary"]

[[symbol]]
tokens = ["eigenvalue", "eigenvalues", "spectrum"]
constants = ["Matrix.IsHermitian.eigenvalues", "Module.End.HasEigenvalue", "spectrum"]

[[symbol]]
tokens = ["positive", "semidefinite", "posdef", "psd"]
constants = ["Matrix.PosSemidef", "Matrix.PosDef"]
context = ["matrix", "operator", "semidefinite", "definite"]

[[symbol]]
# `⟪ ⟫`, as `⟨ ⟩` is mostly Lean's anonymous constructor.
tokens = ["⟪", "⟫", "inner"]
constants = ["Inner.inner"]

[[symbol]]
tokens = ["‖", "norm"]
constants = ["Norm.norm"]

[[symbol]]
tokens = ["rank"]
constants = ["Matrix.rank", "Module.finrank"]

[[symbol]]
